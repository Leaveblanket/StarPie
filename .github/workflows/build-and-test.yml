name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify StarPie
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore StarPie/StarPie.slnx

    - name: Build Solution (Release)
      run: dotnet build StarPie/StarPie.csproj -c Release --no-restore

    - name: Run Unit Tests (xUnit)
      run: dotnet test StarPie.Tests/StarPie.Tests.csproj -c Release --no-restore

    - name: Publish Standalone Binary
      run: dotnet publish StarPie/StarPie.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o bin/Standalone

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: StarPie-Standalone-win-x64
        path: bin/Standalone/StarPie.exe
